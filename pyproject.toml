[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
]

[project.optional-dependencies]
cuda = ["kernels>=0.11.7"]  # FA3 kernels for NVIDIA GPUs

[tool.uv.sources]
torch = [
    # For AMD GPUs (ROCm), comment out the line below and uncomment the ROCm line:
    { index = "pytorch-cu128" },
    # { index = "pytorch-rocm62" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm62"
url = "https://download.pytorch.org/whl/rocm6.2.4"
explicit = true
